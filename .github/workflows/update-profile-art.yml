name: Refresh profile contribution art

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Fetch public contribution data
        run: python scripts/fetch_contributions.py
      - name: Render contribution heatmap
        run: python scripts/render_contribution_heatmap.py
      - name: Validate generated profile
        run: python scripts/validate_profile.py
      - name: Commit changed generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contribution-heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile contribution data [skip ci]"
          git \
            push
