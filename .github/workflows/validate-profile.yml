name: Validate profile

on:
  push:
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Regenerate and verify deterministic assets
        run: |
          python scripts/generate_all.py
          git diff --exit-code -- assets
      - name: Validate profile references and SVG safety
        run: python scripts/validate_profile.py
