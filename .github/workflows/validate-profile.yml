name: Validate profile

on:
  push:
    paths:
      - "README.md"
      - "assets/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt -r scripts/requirements-wordmark.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Regenerate animated and static assets
        run: python scripts/generate_all.py
      - name: Verify committed assets are fresh
        run: git diff --exit-code -- assets
      - name: Validate profile references and SVG safety
        run: python scripts/validate_profile.py
