<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" role="img">
  <title>KJ system identity card</title>
  <desc>Neofetch-inspired identity card for KJ-AIML.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .panel { fill: #161B22; stroke: #30363D; }
    .muted { fill: #8B949E; }
    .text { fill: #E6EDF3; }
    .mint { fill: #59F3C0; }
    .blue { fill: #7AA2F7; }
    .yellow { fill: #F2CC60; }
    @media (prefers-reduced-motion: reduce) { .animated { animation: none !important; } }
  </style>

<rect width="420" height="360" rx="14" fill="#0D1117"/><rect x="1" y="1" width="418" height="358" rx="14" fill="none" stroke="#30363D"/>
<text x="24" y="38" font-size="16" class="mint">KJ-AIML@github</text>
<text x="24" y="58" font-size="12" class="muted">────────────────────────────────</text>
