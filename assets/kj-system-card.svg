<animate attributeName="opacity" values="0.35;1" dur="0.45s" begin="0.00s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 3;0 0" dur="0.45s" begin="0.00s" fill="freeze"/>
</g>
