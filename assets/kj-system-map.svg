<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="430" viewBox="0 0 420 430" role="img">
  <title>KJ AI infrastructure system map</title>
  <desc>A vertical flow from human requirements through planning, orchestration, execution, validation, and deployable systems.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .panel { fill: #161B22; stroke: #30363D; }
    .muted { fill: #8B949E; }
    .text { fill: #E6EDF3; }
    .mint { fill: #59F3C0; }
    .blue { fill: #7AA2F7; }
    .yellow { fill: #F2CC60; }
    @media (prefers-reduced-motion: reduce) { .animated { animation: none !important; } }
  </style>

<rect width="420" height="430" rx="14" fill="#0D1117"/><rect x="1" y="1" width="418" height="428" rx="14" fill="none" stroke="#30363D"/>
<text x="24" y="34" font-size="15" class="text">SYSTEM FLOW / <tspan class="mint">one pass</tspan></text>
<line x1="42" y1="94" x2="42" y2="114" stroke="#30363D" stroke-width="2"/>
<circle cx="42" cy="76" r="13" fill="#161B22" stroke="#59F3C0" stroke-width="2"/>
<text x="38" y="81" font-size="11" fill="#59F3C0">01</text>
<rect x="72" y="56" width="318" height="40" rx="8" fill="#161B22" stroke="#30363D"/>
<g opacity="0.35"><text x="88" y="73" font-size="12" fill="#59F3C0">Human requirement</text><text x="88" y="88" font-size="10" class="muted">intent</text>
<animate attributeName="opacity" values="0.35;1" dur="0.5s" begin="0.00s" fill="freeze"/>
</g>
<line x1="42" y1="152" x2="42" y2="172" stroke="#30363D" stroke-width="2"/>
<circle cx="42" cy="134" r="13" fill="#161B22" stroke="#7AA2F7" stroke-width="2"/>
<text x="38" y="139" font-size="11" fill="#7AA2F7">02</text>
<rect x="72" y="114" width="318" height="40" rx="8" fill="#161B22" stroke="#30363D"/>
<g opacity="0.35"><text x="88" y="131" font-size="12" fill="#7AA2F7">Specification &amp; planning</text><text x="88" y="146" font-size="10" class="muted">ALMS</text>
<animate attributeName="opacity" values="0.35;1" dur="0.5s" begin="0.18s" fill="freeze"/>
</g>
<line x1="42" y1="210" x2="42" y2="230" stroke="#30363D" stroke-width="2"/>
<circle cx="42" cy="192" r="13" fill="#161B22" stroke="#F2CC60" stroke-width="2"/>
<text x="38" y="197" font-size="11" fill="#F2CC60">03</text>
<rect x="72" y="172" width="318" height="40" rx="8" fill="#161B22" stroke="#30363D"/>
<g opacity="0.35"><text x="88" y="189" font-size="12" fill="#F2CC60">Agent orchestration</text><text x="88" y="204" font-size="10" class="muted">LangGraph / skills</text>
<animate attributeName="opacity" values="0.35;1" dur="0.5s" begin="0.36s" fill="freeze"/>
</g>
<line x1="42" y1="268" x2="42" y2="288" stroke="#30363D" stroke-width="2"/>
<circle cx="42" cy="250" r="13" fill="#161B22" stroke="#7AA2F7" stroke-width="2"/>
<text x="38" y="255" font-size="11" fill="#7AA2F7">04</text>
<rect x="72" y="230" width="318" height="40" rx="8" fill="#161B22" stroke="#30363D"/>
<g opacity="0.35"><text x="88" y="247" font-size="12" fill="#7AA2F7">Harness &amp; sandbox execution</text><text x="88" y="262" font-size="10" class="muted">tooling</text>
<animate attributeName="opacity" values="0.35;1" dur="0.5s" begin="0.54s" fill="freeze"/>
</g>
<line x1="42" y1="326" x2="42" y2="346" stroke="#30363D" stroke-width="2"/>
<circle cx="42" cy="308" r="13" fill="#161B22" stroke="#59F3C0" stroke-width="2"/>
<text x="38" y="313" font-size="11" fill="#59F3C0">05</text>
<rect x="72" y="288" width="318" height="40" rx="8" fill="#161B22" stroke="#30363D"/>
<g opacity="0.35"><text x="88" y="305" font-size="12" fill="#59F3C0">Validation</text><text x="88" y="320" font-size="10" class="muted">traceable checks</text>
<animate attributeName="opacity" values="0.35;1" dur="0.5s" begin="0.72s" fill="freeze"/>
</g>
<circle cx="42" cy="366" r="13" fill="#161B22" stroke="#E6EDF3" stroke-width="2"/>
<text x="38" y="371" font-size="11" fill="#E6EDF3">06</text>
<rect x="72" y="346" width="318" height="40" rx="8" fill="#161B22" stroke="#30363D"/>
<g opacity="0.35"><text x="88" y="363" font-size="12" fill="#E6EDF3">Deployable backend / tool</text><text x="88" y="378" font-size="10" class="muted">ship</text>
<animate attributeName="opacity" values="0.35;1" dur="0.5s" begin="0.90s" fill="freeze"/>
</g>
<text x="24" y="408" font-size="10" class="muted">products and tools attach at the layers that need them</text>
</svg>
